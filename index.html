<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Rabi Kapada Pasal - Karobar Khata</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- FIREBASE SDKs (v8 Compat - 100% Free Spark Tier) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-deep: #020617;
            --surface: #0f172a;
            --surface-elevated: #1e293b;
            --border: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --karobar-green: #10b981;
            --karobar-green-bg: rgba(16, 185, 129, 0.12);
            --karobar-red: #f43f5e;
            --karobar-red-bg: rgba(244, 63, 94, 0.12);
            --accent-blue: #38bdf8;
            --accent-wa: #25d366;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            line-height: 1.5; 
            -webkit-font-smoothing: antialiased; 
            user-select: none;
        }

        .tabular-num { font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em; }
        .currency { font-size: 0.7em; opacity: 0.8; font-weight: 700; margin-right: 2px; }

        .svg-icon { width: 20px; height: 20px; stroke-width: 2.2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        /* VIEW CONTAINER */
        .view { display: none; max-width: 600px; margin: 0 auto; min-height: 100vh; position: relative; }
        .view.active { display: block; }

        /* HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .app-title-group h1 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -0.02em; color: var(--text-main); }
        .app-title-group p { margin: 2px 0 0 0; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }

        #cloudStatus { font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 100px; display: inline-flex; align-items: center; gap: 6px; }
        .status-online { background: var(--karobar-green-bg); color: var(--karobar-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-sync { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .status-error { background: var(--karobar-red-bg); color: var(--karobar-red); border: 1px solid rgba(244, 63, 94, 0.3); }

        /* KAROBAR DUAL KPI BANNER */
        .kpi-banner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin: 16px 16px 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px -10px rgba(0,0,0,0.5);
        }
        .kpi-box { padding: 16px; display: flex; flex-direction: column; justify-content: center; }
        .kpi-box.left { border-right: 1px solid var(--border); background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, transparent 100%); }
        .kpi-box.right { background: linear-gradient(180deg, rgba(244, 63, 94, 0.05) 0%, transparent 100%); }
        .kpi-box-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
        .kpi-box-val { font-size: 20px; font-weight: 900; }
        .kpi-box.left .kpi-box-label { color: var(--karobar-green); }
        .kpi-box.left .kpi-box-val { color: var(--karobar-green); }
        .kpi-box.right .kpi-box-label { color: var(--karobar-red); }
        .kpi-box.right .kpi-box-val { color: var(--karobar-red); }

        /* SEGMENTED FILTER TABS */
        .type-tabs {
            display: flex;
            background: var(--surface-elevated);
            margin: 0 16px 14px 16px;
            padding: 4px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }
        .type-tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 9px 0;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .type-tab-btn.active { background: var(--accent-blue); color: #020617; box-shadow: 0 4px 12px rgba(56,189,248,0.3); }

        /* SEARCH BAR */
        .search-box { margin: 0 16px 14px 16px; position: relative; }
        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 16px 14px 44px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus { border-color: var(--accent-blue); }
        .search-box svg { position: absolute; left: 16px; top: 15px; color: var(--text-muted); }

        /* PARTIES LIST */
        .party-list { padding: 0 16px 100px 16px; }
        .party-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 18px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }
        .party-card:active { transform: scale(0.98); border-color: var(--accent-blue); }
        .party-info { display: flex; align-items: center; gap: 14px; }
        .party-avatar {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 17px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .party-name { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .party-meta { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .party-balance { text-align: right; }
        .party-bal-num { font-size: 16px; font-weight: 900; display: block; }
        .party-bal-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }

        /* FLOATING ACTION BUTTON (ADD PARTY) */
        .fab-add {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            right: 20px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            padding: 14px 22px;
            border-radius: 100px;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
            z-index: 90;
            transition: transform 0.2s;
        }
        .fab-add:active { transform: scale(0.95); }

        /* ================================================================= */
        /* PARTY KHATA DETAIL VIEW                                           */
        /* ================================================================= */
        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .nav-back-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .detail-party-title { flex: 1; margin: 0 12px; }
        .detail-party-title h2 { margin: 0; font-size: 17px; font-weight: 900; }
        .detail-party-title span { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .detail-actions { display: flex; gap: 8px; }
        .action-icon-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .action-icon-btn.wa { color: var(--accent-wa); background: rgba(37, 211, 102, 0.1); border-color: rgba(37, 211, 102, 0.3); }

        /* SUMMARY BAR */
        .detail-summary {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-sum-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-sum-val { font-size: 22px; font-weight: 900; }

        /* ENTRIES LIST & TABLE */
        .entries-container { padding: 12px 16px 130px 16px; }
        .entry-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-left: 5px solid transparent;
        }
        .entry-card.gave { border-left-color: var(--karobar-red); }
        .entry-card.got { border-left-color: var(--karobar-green); }

        .entry-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .entry-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-gave { background: var(--karobar-red-bg); color: var(--karobar-red); }
        .badge-got { background: var(--karobar-green-bg); color: var(--karobar-green); }

        .entry-amt { font-size: 18px; font-weight: 900; }
        .entry-amt.gave { color: var(--karobar-red); }
        .entry-amt.got { color: var(--karobar-green); }

        .entry-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 6px; }
        .entry-note { font-size: 12px; font-style: italic; color: var(--text-muted); margin-top: 6px; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 8px; }
        
        .entry-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04); }
        .entry-bal { font-size: 12px; font-weight: 800; color: var(--accent-blue); }
        .entry-btns { display: flex; gap: 8px; }
        .entry-mini-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 6px; cursor: pointer; }

        /* FIXED BOTTOM GAVE / GOT ACTION BAR */
        .bottom-gave-got-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            z-index: 100;
        }
        .btn-gave {
            flex: 1;
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
        }
        .btn-got {
            flex: 1;
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-gave:active, .btn-got:active { transform: scale(0.97); }

        /* BOTTOM SHEETS & FORMS */
        .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 15000; }
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: 32px 32px 0 0;
            padding: 28px 24px calc(50px + env(safe-area-inset-bottom)) 24px;
            z-index: 16000;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-light);
            border-bottom: none;
            max-height: 90vh;
            overflow-y: auto;
            max-width: 600px;
            margin: 0 auto;
        }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 100px; margin: -12px auto 20px auto; }

        .floating-input { position: relative; margin-bottom: 14px; }
        .floating-input input, .floating-input select {
            width: 100%; padding: 20px 16px 8px 16px; border-radius: 16px;
            border: 2px solid transparent; background: var(--surface-elevated);
            font-size: 16px; font-weight: 700; color: var(--text-main);
            outline: none; transition: 0.2s; font-family: inherit; -webkit-appearance: none;
        }
        .floating-input label {
            position: absolute; left: 16px; top: 16px; font-size: 13px;
            color: var(--text-muted); font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; transition: 0.2s; pointer-events: none;
        }
        .floating-input input:focus { border-color: var(--accent-blue); background: rgba(56,189,248,0.05); }
        .floating-input input:focus ~ label, .floating-input input:not(:placeholder-shown) ~ label,
        .floating-input select:focus ~ label, .floating-input select:valid ~ label { top: 5px; font-size: 10px; color: var(--accent-blue); }
        .floating-input input[type="date"] ~ label { top: 5px; font-size: 10px; color: var(--accent-blue); }

        .btn-full {
            border: none; border-radius: 100px; padding: 16px; font-weight: 800; font-size: 15px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; }

        /* PIN LOCK SCREEN */
        #pinScreen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 25000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;}
        .pin-input { width: 100%; max-width: 300px; font-size: 34px; letter-spacing: 20px; font-weight: 900; text-align: center; border: none; border-bottom: 2px solid var(--border); padding: 12px; margin: 30px 0; outline: none; background: transparent; color: var(--text-main); }
        .pin-input:focus { border-bottom-color: var(--accent-blue); }

        #toast { visibility: hidden; position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: var(--surface-elevated); color: var(--text-main); padding: 12px 24px; border-radius: 100px; font-size: 13px; font-weight: 800; z-index: 30000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid var(--border-light); white-space: nowrap; }
        #toast.show { visibility: visible; animation: dropDown 2.5s; }
        @keyframes dropDown { 0%, 100% { transform: translateX(-50%) translateY(-20px); opacity: 0; } 15%, 85% { transform: translateX(-50%) translateY(0); opacity: 1; } }

        #imageViewer { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98); z-index: 30000; justify-content: center; align-items: center;}
        #imageViewer img { max-width: 95%; max-height: 90%; border-radius: 16px; object-fit: contain; }
    </style>
</head>
<body>

<div id="toast">Message</div>

<!-- IMAGE VIEWER -->
<div id="imageViewer" onclick="this.style.display='none'">
    <img id="fullImage" src="" />
</div>

<!-- SHEET BACKDROP -->
<div id="sheetOverlay" class="sheet-overlay" onclick="closeSheets()"></div>

<!-- PIN SECURITY SCREEN -->
<div id="pinScreen">
    <div style="width: 64px; height: 64px; background: rgba(56,189,248,0.1); color: var(--accent-blue); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <svg class="svg-icon" style="width: 32px; height: 32px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 id="pinTitle" style="margin:0 0 6px 0; font-size: 24px; font-weight: 900;">Rabi Kapada Pasal</h2>
    <p id="pinSubtitle" style="color:var(--text-muted); margin:0; font-size: 13px; font-weight: 600;">Karobar Digital Khata</p>
    <input type="password" id="pinInput" class="pin-input" maxlength="4" inputmode="numeric">
    <button class="btn-full btn-primary" onclick="verifyPin()" style="max-width: 300px;">Unlock Vault</button>
</div>

<!-- ================================================================= -->
<!-- 1. HOME VIEW (PARTIES DIRECTORY)                                  -->
<!-- ================================================================= -->
<div id="homeView" class="view active">
    
    <div class="app-header">
        <div class="app-title-group">
            <h1>Rabi Kapada Pasal</h1>
            <p>Digital Khata</p>
        </div>
        <div id="cloudStatus" class="status-sync">⏳ Syncing...</div>
    </div>

    <!-- DUAL KPI BANNER -->
    <div class="kpi-banner">
        <div class="kpi-box left">
            <span class="kpi-box-label">तपाईंले लिनुपर्ने (You'll Get)</span>
            <div class="kpi-box-val tabular-num" id="kpiTotalGet"><span class="currency">Rs.</span>0</div>
        </div>
        <div class="kpi-box right">
            <span class="kpi-box-label">तपाईंले दिनुपर्ने (You'll Give)</span>
            <div class="kpi-box-val tabular-num" id="kpiTotalGive"><span class="currency">Rs.</span>0</div>
        </div>
    </div>

    <!-- CUSTOMERS VS SUPPLIERS TAB TOGGLE -->
    <div class="type-tabs">
        <button class="type-tab-btn active" id="tabCustomers" onclick="setPartyFilter('customer')">Customers (ग्राहक)</button>
        <button class="type-tab-btn" id="tabSuppliers" onclick="setPartyFilter('supplier')">Suppliers (साहु)</button>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="partySearch" onkeyup="filterParties()" placeholder="Search by name or phone...">
    </div>

    <!-- PARTIES LIST -->
    <div id="partiesList" class="party-list"></div>

    <!-- FLOATING ADD PARTY BUTTON -->
    <button class="fab-add" onclick="openAddPartySheet()">
        <svg class="svg-icon" style="width:18px;height:18px;"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add Party</span>
    </button>
</div>

<!-- ================================================================= -->
<!-- 2. PARTY KHATA DETAIL VIEW                                        -->
<!-- ================================================================= -->
<div id="detailView" class="view">
    
    <div class="detail-header">
        <button class="nav-back-btn" onclick="showHomeView()">
            <svg class="svg-icon"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="detail-party-title">
            <h2 id="detailPartyName">Party Name</h2>
            <span id="detailPartyPhone">98XXXXXXXX</span>
        </div>
        <div class="detail-actions">
            <a id="btnCallParty" href="tel:" class="action-icon-btn">📞</a>
            <button onclick="sendKarobarWhatsApp()" class="action-icon-btn wa">💬</button>
            <button onclick="openEditPartySheet()" class="action-icon-btn">✏️</button>
        </div>
    </div>

    <!-- RUNNING BALANCE SUMMARY -->
    <div class="detail-summary">
        <div>
            <span class="detail-sum-label" id="detailBalLabel">Net Balance</span>
            <div class="detail-sum-val tabular-num" id="detailBalVal"><span class="currency">Rs.</span>0</div>
        </div>
        <button onclick="exportPartyCSV()" style="background:var(--surface-elevated); color:var(--accent-blue); border:1px solid var(--border); padding:8px 14px; border-radius:100px; font-size:12px; font-weight:800; cursor:pointer;">
            📥 Report
        </button>
    </div>

    <!-- STATEMENT ENTRIES -->
    <div id="detailEntries" class="entries-container"></div>

    <!-- KAROBAR SIGNATURE GAVE / GOT ACTION BAR -->
    <div class="bottom-gave-got-bar">
        <button class="btn-gave" onclick="openTxSheet('gave')">
            <svg class="svg-icon" style="width:18px;height:18px;"><path d="M12 5v14M5 12h14"/></svg>
            <span>YOU GAVE (दिने)</span>
        </button>
        <button class="btn-got" onclick="openTxSheet('got')">
            <svg class="svg-icon" style="width:18px;height:18px;"><path d="M5 12h14"/></svg>
            <span>YOU GOT (लिने)</span>
        </button>
    </div>
</div>

<!-- ================================================================= -->
<!-- 3. ADD / EDIT PARTY SHEET                                         -->
<!-- ================================================================= -->
<div id="partySheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h3 id="partySheetTitle" style="margin:0 0 16px 0; font-size:19px; font-weight:900;">Add New Party</h3>
    
    <div class="floating-input">
        <input type="text" id="partyInputName" placeholder=" " required>
        <label>Party Name</label>
    </div>
    
    <div class="floating-input">
        <input type="tel" id="partyInputPhone" placeholder=" ">
        <label>Mobile Number</label>
    </div>

    <div class="floating-input">
        <select id="partyInputType">
            <option value="customer">Customer (ग्राहक)</option>
            <option value="supplier">Supplier / Karigar (साहु)</option>
        </select>
        <label>Party Type</label>
    </div>

    <input type="hidden" id="partyEditId">
    
    <button class="btn-full btn-primary" onclick="saveParty()" style="margin-top:10px;">Save Party</button>
</div>

<!-- ================================================================= -->
<!-- 4. GAVE / GOT TRANSACTION ENTRY SHEET                             -->
<!-- ================================================================= -->
<div id="txSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h3 id="txSheetTitle" style="margin:0 0 16px 0; font-size:19px; font-weight:900;">Record Transaction</h3>
    
    <div style="display:flex; gap:12px;">
        <div class="floating-input" style="flex:1.2;">
            <input type="number" step="any" id="txAmount" placeholder=" " required>
            <label>Amount (Rs)</label>
        </div>
        <div class="floating-input" style="flex:1;">
            <input type="text" id="txBillNo" placeholder=" ">
            <label>Bill / Challan #</label>
        </div>
    </div>

    <div class="floating-input">
        <input type="date" id="txDate" required>
        <label>Date</label>
    </div>

    <div class="floating-input">
        <input type="text" id="txNotes" placeholder=" ">
        <label>Details / Notes (Optional)</label>
    </div>

    <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px; display:block;">Bill Photo (Optional)</label>
    <input type="file" id="txPhoto" accept="image/*" style="width:100%; background:var(--surface-elevated); border:2px dashed var(--border); padding:14px; border-radius:16px; color:var(--text-muted); margin-bottom:20px; font-size:13px;">

    <input type="hidden" id="txEntryType">
    <input type="hidden" id="txEditId">
    
    <button id="txSubmitBtn" class="btn-full" onclick="saveTransaction()" style="color:white; font-weight:900;">Save Entry</button>
</div>

<script>
    // ====================================================================
    // CONFIGURATION & GLOBAL STATE
    // ====================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyADlEGFdU0t7pAMvOrZTWgpAFUkbPWm7R0",
        authDomain: "kapada-6283b.firebaseapp.com",
        projectId: "kapada-6283b",
        storageBucket: "kapada-6283b.firebasestorage.app",
        messagingSenderId: "25954227994",
        appId: "1:25954227994:web:b162c3e5f46055dd59bea3"
    };

    let db, auth;
    let parties = [];
    let transactions = [];
    let currentFilter = 'customer'; // 'customer' or 'supplier'
    let selectedPartyId = null;

    const PIN_SALT = "garmentos_rabi_vault_2026";
    let savedPinHash = localStorage.getItem('karobar_pin_hash');

    const AVATAR_COLORS = [
        'linear-gradient(135deg, #f43f5e, #be123c)', 
        'linear-gradient(135deg, #f97316, #c2410c)', 
        'linear-gradient(135deg, #eab308, #a16207)', 
        'linear-gradient(135deg, #10b981, #047857)', 
        'linear-gradient(135deg, #0ea5e9, #0369a1)', 
        'linear-gradient(135deg, #8b5cf6, #6d28d9)', 
        'linear-gradient(135deg, #d946ef, #a21caf)'
    ];

    function getAvatarColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    // ====================================================================
    // SECURITY & PIN LOCK
    // ====================================================================
    async function hashPin(pin) {
        const encoder = new TextEncoder();
        const data = encoder.encode(pin + PIN_SALT);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    (async function initPin() {
        if (!savedPinHash) {
            document.getElementById('pinTitle').innerText = "Set 4-Digit PIN";
            document.getElementById('pinSubtitle').innerText = "Create a master passcode for Rabi Kapada";
        }
    })();

    async function verifyPin() {
        const val = document.getElementById('pinInput').value;
        if (val.length !== 4) return showToast("Enter a 4-digit PIN");
        
        const hashedVal = await hashPin(val);
        if (!savedPinHash) {
            localStorage.setItem('karobar_pin_hash', hashedVal);
            savedPinHash = hashedVal;
            startApp();
        } else if (hashedVal === savedPinHash) {
            startApp();
        } else {
            document.getElementById('pinInput').value = '';
            showToast("Incorrect PIN");
        }
    }

    function setCloudStatus(status, msg) {
        const el = document.getElementById('cloudStatus');
        el.className = 'status-' + status;
        if (status === 'online') el.innerHTML = `<svg class="svg-icon" style="width:13px; height:13px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ${msg}`;
        else if (status === 'error') el.innerHTML = `⚠️ ${msg}`;
        else el.innerHTML = `⏳ ${msg}`;
    }

    // ====================================================================
    // DATABASE INITIALIZATION (100% Spark Plan / Firestore)
    // ====================================================================
    function startApp() {
        document.getElementById('pinScreen').style.display = 'none';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        db.enablePersistence({ synchronizeTabs: true }).catch(()=>{});

        auth.signInAnonymously().then(() => {
            initRealtimeSync();
        }).catch(() => {
            initRealtimeSync();
        });
    }

    function initRealtimeSync() {
        setCloudStatus('sync', 'Syncing...');

        // Listen to Suppliers/Customers (Parties)
        db.collection("suppliers").onSnapshot(snapshot => {
            parties = [];
            snapshot.forEach(doc => {
                const p = doc.data();
                p.id = doc.id;
                // Default legacy entries without type to 'customer'
                if (!p.type) p.type = (p.category && p.category.toLowerCase().includes('vendor')) ? 'supplier' : 'customer';
                parties.push(p);
            });
            renderHomeView();
            if (selectedPartyId) renderDetailView(selectedPartyId);
            setCloudStatus('online', 'Live');
        }, () => setCloudStatus('error', 'Offline'));

        // Listen to Transactions
        db.collection("txs").onSnapshot(snapshot => {
            transactions = [];
            snapshot.forEach(doc => {
                const t = doc.data();
                t.id = doc.id;
                // Backwards compatibility: map isDebt to gave/got
                if (!t.txType) t.txType = t.isDebt ? 'gave' : 'got';
                transactions.push(t);
            });
            transactions.sort((a,b) => (b.date || "").localeCompare(a.date || ""));
            renderHomeView();
            if (selectedPartyId) renderDetailView(selectedPartyId);
        });
    }

    // ====================================================================
    // HOME VIEW: KAROBAR STYLE
    // ====================================================================
    function setPartyFilter(type) {
        currentFilter = type;
        document.getElementById('tabCustomers').classList.toggle('active', type === 'customer');
        document.getElementById('tabSuppliers').classList.toggle('active', type === 'supplier');
        renderHomeView();
    }

    function calculatePartyBalance(partyId) {
        // Karobar Rule:
        // You Gave = Customer owes you (+), or Supplier debt decreases
        // Net Balance = Sum(Gave) - Sum(Got)
        return transactions.filter(t => t.supId === partyId).reduce((acc, t) => {
            return t.txType === 'gave' ? acc + t.val : acc - t.val;
        }, 0);
    }

    function renderHomeView() {
        let totalGet = 0;
        let totalGive = 0;

        parties.forEach(p => {
            const bal = calculatePartyBalance(p.id);
            if (bal > 0) totalGet += bal;
            if (bal < 0) totalGive += Math.abs(bal);
        });

        document.getElementById('kpiTotalGet').innerHTML = `<span class="currency">Rs.</span>` + totalGet.toLocaleString('en-IN', { maximumFractionDigits: 0 });
        document.getElementById('kpiTotalGive').innerHTML = `<span class="currency">Rs.</span>` + totalGive.toLocaleString('en-IN', { maximumFractionDigits: 0 });

        const filtered = parties.filter(p => p.type === currentFilter).sort((a,b) => a.name.localeCompare(b.name));
        const container = document.getElementById('partiesList');
        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:50px 20px; color:var(--text-muted); font-size:14px; font-weight:700;">No ${currentFilter}s added yet.<br>Tap "+ Add Party" below.</div>`;
            return;
        }

        filtered.forEach(p => {
            const bal = calculatePartyBalance(p.id);
            const initial = p.name.charAt(0).toUpperCase();
            const avatarBg = getAvatarColor(p.name);
            
            let balColor = 'var(--text-muted)';
            let balText = 'Settled';
            if (bal > 0) {
                balColor = 'var(--karobar-green)';
                balText = "You'll Get";
            } else if (bal < 0) {
                balColor = 'var(--karobar-red)';
                balText = "You'll Give";
            }

            const card = document.createElement('div');
            card.className = 'party-card';
            card.onclick = () => openPartyDetail(p.id);
            card.innerHTML = `
                <div class="party-info">
                    <div class="party-avatar" style="background:${avatarBg}">${initial}</div>
                    <div>
                        <div class="party-name">${p.name}</div>
                        <div class="party-meta">${p.phone || 'No phone'}</div>
                    </div>
                </div>
                <div class="party-balance">
                    <span class="party-bal-num tabular-num" style="color:${balColor}">
                        <span class="currency">Rs.</span>${Math.abs(bal).toLocaleString('en-IN', {minimumFractionDigits:2})}
                    </span>
                    <span class="party-bal-label" style="color:${balColor}">${balText}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterParties() {
        const q = document.getElementById('partySearch').value.toLowerCase();
        document.querySelectorAll('.party-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }

    // ====================================================================
    // PARTY KHATA STATEMENT VIEW
    // ====================================================================
    function openPartyDetail(partyId) {
        selectedPartyId = partyId;
        document.getElementById('homeView').classList.remove('active');
        document.getElementById('detailView').classList.add('active');
        window.scrollTo(0, 0);
        renderDetailView(partyId);
    }

    function showHomeView() {
        selectedPartyId = null;
        document.getElementById('detailView').classList.remove('active');
        document.getElementById('homeView').classList.add('active');
        renderHomeView();
    }

    function renderDetailView(partyId) {
        const party = parties.find(p => p.id === partyId);
        if (!party) return showHomeView();

        document.getElementById('detailPartyName').innerText = party.name;
        document.getElementById('detailPartyPhone').innerText = party.phone || 'No phone added';
        document.getElementById('btnCallParty').href = party.phone ? `tel:${party.phone}` : '#';

        // Chronological math for running balances
        const pTxs = transactions.filter(t => t.supId === partyId).sort((a,b) => (a.date || "").localeCompare(b.date || ""));
        let rBal = 0;
        pTxs.forEach(t => {
            rBal += (t.txType === 'gave' ? t.val : -t.val);
            t.runBal = rBal;
        });

        // Summary bar status
        const netBal = rBal;
        const balValEl = document.getElementById('detailBalVal');
        const balLabelEl = document.getElementById('detailBalLabel');

        if (netBal > 0) {
            balLabelEl.innerText = "तपाईंले लिनुपर्ने (YOU'LL GET)";
            balValEl.style.color = "var(--karobar-green)";
        } else if (netBal < 0) {
            balLabelEl.innerText = "तपाईंले दिनुपर्ने (YOU'LL GIVE)";
            balValEl.style.color = "var(--karobar-red)";
        } else {
            balLabelEl.innerText = "NET BALANCE";
            balValEl.style.color = "var(--text-muted)";
        }
        balValEl.innerHTML = `<span class="currency">Rs.</span>${Math.abs(netBal).toLocaleString('en-IN', {minimumFractionDigits:2})}`;

        // Render entries in reverse chronological order
        const container = document.getElementById('detailEntries');
        container.innerHTML = '';

        if (pTxs.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px; font-weight:700;">No bills or payments logged yet.<br>Use the buttons below to add one.</div>`;
            return;
        }

        pTxs.slice().reverse().forEach(t => {
            const isGave = t.txType === 'gave';
            const card = document.createElement('div');
            card.className = `entry-card ${isGave ? 'gave' : 'got'}`;
            card.innerHTML = `
                <div class="entry-top">
                    <div>
                        <span class="entry-badge ${isGave ? 'badge-gave' : 'badge-got'}">
                            ${isGave ? '↗ YOU GAVE (दिने)' : '↙ YOU GOT (लिने)'}
                        </span>
                        ${t.billNo ? `<span style="font-size:11px; font-weight:800; color:var(--accent-blue); margin-left:6px;">#${t.billNo}</span>` : ''}
                    </div>
                    <span class="entry-amt ${isGave ? 'gave' : 'got'} tabular-num">
                        <span class="currency">Rs.</span>${t.val.toLocaleString('en-IN')}
                    </span>
                </div>
                <div class="entry-meta">
                    <span>${t.date || ''}</span>
                    <span class="entry-bal">Bal: Rs. ${t.runBal.toLocaleString('en-IN')}</span>
                </div>
                ${t.notes ? `<div class="entry-note">📝 ${t.notes}</div>` : ''}
                ${t.img ? `<img src="${t.img}" onclick="viewImage('${t.img}')" style="max-width:130px; border-radius:10px; margin-top:8px; border:1px solid var(--border-light); cursor:zoom-in;">` : ''}
                <div class="entry-footer">
                    <span style="font-size:11px; color:var(--text-muted);">${t.type || ''}</span>
                    <div class="entry-btns">
                        <button class="entry-mini-btn" onclick="editTransaction('${t.id}')">✏️</button>
                        <button class="entry-mini-btn" onclick="deleteTransaction('${t.id}')">🗑️</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ====================================================================
    // PARTY CRUD
    // ====================================================================
    function openAddPartySheet() {
        document.getElementById('partySheetTitle').innerText = "Add New Party";
        document.getElementById('partyEditId').value = '';
        document.getElementById('partyInputName').value = '';
        document.getElementById('partyInputPhone').value = '';
        document.getElementById('partyInputType').value = currentFilter;
        openSheet('partySheet');
    }

    function openEditPartySheet() {
        const party = parties.find(p => p.id === selectedPartyId);
        if (!party) return;
        document.getElementById('partySheetTitle').innerText = "Edit Party";
        document.getElementById('partyEditId').value = party.id;
        document.getElementById('partyInputName').value = party.name;
        document.getElementById('partyInputPhone').value = party.phone || '';
        document.getElementById('partyInputType').value = party.type || 'customer';
        openSheet('partySheet');
    }

    function saveParty() {
        const name = document.getElementById('partyInputName').value.trim();
        const phone = document.getElementById('partyInputPhone').value.trim();
        const type = document.getElementById('partyInputType').value;
        const editId = document.getElementById('partyEditId').value;

        if (!name) return showToast("Party name required");

        const partyId = editId || ("P_" + Date.now().toString());
        const data = {
            id: partyId,
            name: name,
            phone: phone,
            type: type,
            workspaceId: 'FIRM_1' // Kept clean and scoped to Rabi Kapada
        };

        setCloudStatus('sync', 'Saving Party...');
        db.collection("suppliers").doc(partyId).set(data).then(() => {
            closeSheets();
            showToast("Party Saved");
            if (selectedPartyId) renderDetailView(selectedPartyId);
        });
    }

    // ====================================================================
    // TRANSACTION CRUD (YOU GAVE / YOU GOT)
    // ====================================================================
    function openTxSheet(txType) {
        document.getElementById('txEditId').value = '';
        document.getElementById('txEntryType').value = txType;
        document.getElementById('txAmount').value = '';
        document.getElementById('txBillNo').value = '';
        document.getElementById('txNotes').value = '';
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('txPhoto').value = '';

        const title = txType === 'gave' ? "YOU GAVE (तपाईंले दिनुभयो)" : "YOU GOT (तपाईंले लिनुभयो)";
        const btn = document.getElementById('txSubmitBtn');
        document.getElementById('txSheetTitle').innerText = title;
        btn.innerText = `Save ${txType === 'gave' ? 'Gave' : 'Got'} Entry`;
        btn.style.background = txType === 'gave' ? 'linear-gradient(135deg, #f43f5e, #be123c)' : 'linear-gradient(135deg, #10b981, #047857)';

        openSheet('txSheet');
    }

    function editTransaction(txId) {
        const t = transactions.find(x => x.id === txId);
        if (!t) return;
        document.getElementById('txEditId').value = t.id;
        document.getElementById('txEntryType').value = t.txType || (t.isDebt ? 'gave' : 'got');
        document.getElementById('txAmount').value = t.val;
        document.getElementById('txBillNo').value = t.billNo || '';
        document.getElementById('txNotes').value = t.notes || '';
        document.getElementById('txDate').value = t.date || '';
        document.getElementById('txPhoto').value = '';

        document.getElementById('txSheetTitle').innerText = "Edit Entry";
        const btn = document.getElementById('txSubmitBtn');
        btn.innerText = "Update Entry";
        btn.style.background = 'linear-gradient(135deg, #38bdf8, #2563eb)';

        openSheet('txSheet');
    }

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 650;
                    let scale = 1;
                    if (img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.45));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function saveTransaction() {
        const val = parseFloat(document.getElementById('txAmount').value);
        const billNo = document.getElementById('txBillNo').value.trim();
        const date = document.getElementById('txDate').value;
        const notes = document.getElementById('txNotes').value.trim();
        const txType = document.getElementById('txEntryType').value;
        const editId = document.getElementById('txEditId').value;
        const file = document.getElementById('txPhoto').files[0];

        if (isNaN(val) || val <= 0) return showToast("Enter valid amount");
        if (!date) return showToast("Select date");

        let photoData = null;
        if (file) {
            setCloudStatus('sync', 'Compressing...');
            photoData = await compressImage(file);
        } else if (editId) {
            const existing = transactions.find(t => t.id === editId);
            if (existing) photoData = existing.img;
        }

        const id = editId || Date.now().toString();
        const newRecord = {
            id: id,
            supId: selectedPartyId,
            val: val,
            txType: txType,
            isDebt: (txType === 'gave'),
            billNo: billNo || null,
            date: date,
            notes: notes,
            img: photoData,
            type: txType === 'gave' ? 'Bill' : 'Payment',
            workspaceId: 'FIRM_1'
        };

        setCloudStatus('sync', 'Saving...');
        db.collection("txs").doc(id).set(newRecord).then(() => {
            closeSheets();
            showToast("Saved");
        });
    }

    function deleteTransaction(id) {
        if (confirm("Delete this entry permanently?")) {
            setCloudStatus('sync', 'Deleting...');
            db.collection("txs").doc(id).delete().then(() => showToast("Deleted"));
        }
    }

    // ====================================================================
    // POLITE KAROBAR WHATSAPP REMINDER DISPATCH
    // ====================================================================
    function sendKarobarWhatsApp() {
        const party = parties.find(p => p.id === selectedPartyId);
        if (!party || !party.phone) return showToast("No phone number saved");

        let cleanPhone = party.phone.replace(/[^0-9]/g, '');
        if (cleanPhone.length === 10 && !cleanPhone.startsWith('977')) {
            cleanPhone = '977' + cleanPhone;
        }

        const bal = calculatePartyBalance(party.id);
        const amtStr = Math.abs(bal).toLocaleString('en-IN', {minimumFractionDigits:2});
        
        let message = "";
        if (bal > 0) {
            message = `नमस्ते ${party.name} जी,\n\nरवि कपडा पसल (Rabi Kapada Pasal) को खाता विवरण अनुसार तपाईंको बाँकी हिसाब *रु. ${amtStr}* छ। कृपया उक्त रकम भुक्तानी गरिदिनुहुन अनुरोध गर्दछौं।\n\nधन्यवाद!`;
        } else {
            message = `नमस्ते ${party.name} जी,\n\nरवि कपडा पसल (Rabi Kapada Pasal) को खाता विवरण अनुसार तपाईंको खाता चुक्ता/अग्रिम छ।\n\nधन्यवाद!`;
        }

        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    // ====================================================================
    // CSV EXPORT
    // ====================================================================
    function exportPartyCSV() {
        const party = parties.find(p => p.id === selectedPartyId);
        const pTxs = transactions.filter(t => t.supId === selectedPartyId).sort((a,b) => (a.date||"").localeCompare(b.date||""));
        
        if (pTxs.length === 0) return showToast("No records to export");

        let csv = `Statement for ${party.name}\nDate,Bill No,You Gave (Dr),You Got (Cr),Running Balance,Details\n`;
        let run = 0;
        pTxs.forEach(t => {
            const isGave = t.txType === 'gave';
            run += isGave ? t.val : -t.val;
            csv += `${t.date},"${t.billNo || ''}",${isGave ? t.val : 0},${!isGave ? t.val : 0},${run},"${(t.notes || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${party.name.replace(/\s+/g, '_')}_Khata.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ====================================================================
    // UI UTILITIES
    // ====================================================================
    function openSheet(id) {
        document.getElementById('sheetOverlay').style.display = 'block';
        setTimeout(() => document.getElementById(id).classList.add('open'), 10);
    }

    function closeSheets() {
        document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open'));
        setTimeout(() => document.getElementById('sheetOverlay').style.display = 'none', 350);
    }

    function viewImage(src) {
        document.getElementById('fullImage').src = src;
        document.getElementById('imageViewer').style.display = 'flex';
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    // PWA Offline registration
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
</script>
